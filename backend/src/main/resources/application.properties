server.port=8080

# H2 file-based database (persists across restarts); swap to MySQL/Postgres later using database/schema.sql
spring.datasource.url=jdbc:h2:file:./data/stevechat;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT
jwt.secret=steve-chat-super-secret-key-change-me-in-prod-123456
jwt.expiration-ms=86400000

# Media upload limits
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB
