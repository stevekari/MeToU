services:
  # ======================
  # PostgreSQL Database
  # ======================
  database:
    image: postgres:16-alpine
    container_name: giochat-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: giochat
      POSTGRES_USER: giochat
      POSTGRES_PASSWORD: giochat123          # ← change in production!
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d   # optional SQL init scripts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U giochat -d giochat"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - giochat-network

  # ======================
  # Backend (Spring Boot)
  # ======================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: giochat-backend
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/giochat
      SPRING_DATASOURCE_USERNAME: giochat
      SPRING_DATASOURCE_PASSWORD: giochat123
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    volumes:
      - ./backend/uploads:/app/uploads          # persistent uploads
      - ./data:/app/data                        # extra data folder
    networks:
      - giochat-network

  # ======================
  # Frontend
  # ======================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: giochat-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"          # access at http://localhost:3000
    networks:
      - giochat-network

networks:
  giochat-network:
    driver: bridge

volumes:
  postgres_data: