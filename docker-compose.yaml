services:
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    volumes:
      - uploads:/app/uploads
      - dbdata:/app/data
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  uploads:
  dbdata:
